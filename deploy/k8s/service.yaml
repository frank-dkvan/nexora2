apiVersion: v1
kind: Service
metadata:
  name: nexora
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora
    app.kubernetes.io/component: graph-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexora
    app.kubernetes.io/component: graph-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-nodeport
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora
    app.kubernetes.io/component: graph-engine
  annotations:
    description: "NodePort service for testing and local access — remove in production"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nexora
    app.kubernetes.io/component: graph-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
