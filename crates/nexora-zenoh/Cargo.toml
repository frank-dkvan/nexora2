[package]
name = "nexora-zenoh"
version.workspace = true
edition.workspace = true
description = "Eclipse Zenoh integration for distributed graph routing"

[features]
default = []
zenoh = ["dep:zenoh"]

[dependencies]
nexora-id = { path = "../nexora-id" }
nexora-core = { path = "../nexora-core" }
nexora-cypher = { path = "../nexora-cypher" }
nexora-language = { path = "../nexora-language" }
nexora-value = { path = "../nexora-value" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
hex = { workspace = true }
zenoh = { version = "1", optional = true }
rust-rocksdb = { workspace = true }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
futures = "0.3"
blake3 = "1.5"
parking_lot = "0.12"
tiny_http = "0.12"
scopeguard = "1.2"

[dev-dependencies]
tokio = { workspace = true }
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
# Chaos/consistency tests use the Merkle tree to compare replica state.
nexora-raft = { path = "../nexora-raft" }
