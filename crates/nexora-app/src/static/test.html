<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepStreaming Feature Test Suite</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--border:#334155;--primary:#38bdf8;--green:#4ade80;--red:#f87171;--text:#e2e8f0;--text2:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px}
h1{font-size:22px;margin-bottom:8px;color:var(--primary)}
.summary{display:flex;gap:24px;margin:16px 0;padding:16px;background:var(--bg2);border-radius:12px;border:1px solid var(--border)}
.stat{text-align:center}.stat .num{font-size:28px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.test{background:var(--bg2);border-radius:12px;padding:20px;border:1px solid var(--border)}
.test h3{font-size:14px;margin-bottom:8px}
.test .desc{font-size:12px;color:var(--text2);margin-bottom:12px}
.test button{padding:8px 16px;background:var(--primary);color:var(--bg);border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
.test button:hover{opacity:.9}
.test button:disabled{opacity:.5;cursor:default}
.result{margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-family:monospace;font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap}
.result.pending{color:var(--text2)}
.result.loading{color:#fbbf24;border:1px solid #fbbf24}
.result.pass{color:var(--green);border:1px solid var(--green)}
.result.fail{color:var(--red);border:1px solid var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
.badge.api{background:#1e40af;color:#93c5fd}
.badge.graph{background:#4a1d96;color:#c4b5fd}
.badge.sq{background:#78350f;color:#fcd34d}
.badge.e2e{background:#065f46;color:#6ee7b7}
.btn-all{padding:12px 24px;background:var(--primary);color:var(--bg);border:none;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<h1>DeepStreaming Feature Test Suite</h1>
<div class="summary">
  <div class="stat"><div class="num" style="color:#38bdf8" id="cntTotal">0</div><div>Total</div></div>
  <div class="stat"><div class="num" style="color:#4ade80" id="cntPass">0</div><div>Pass</div></div>
  <div class="stat"><div class="num" style="color:#f87171" id="cntFail">0</div><div>Fail</div></div>
  <div class="stat"><div class="num" style="color:#fbbf24" id="cntRun">0</div><div>Running</div></div>
</div>
<button class="btn-all" onclick="runAllTests()">Run All 10 Tests</button>

<div class="grid" style="margin-top:16px" id="testGrid"></div>

<script>
var BASE='';
var pass=0,fail=0,run=0,total=0;

function hex(s){var r='';for(var i=0;i<s.length;i++)r+=s.charCodeAt(i).toString(16).padStart(2,'0');return r;}

function api(url,opts){
  opts=opts||{};
  return fetch(BASE+url,opts).then(function(r){
    if(!r.ok) throw new Error(r.status+' '+r.statusText);
    return r.json();
  });
}

function updateCounts(){
  document.getElementById('cntTotal').textContent=total;
  document.getElementById('cntPass').textContent=pass;
  document.getElementById('cntFail').textContent=fail;
  document.getElementById('cntRun').textContent=run;
}

var testCases = [
  {id:'health',name:'Health Check',badge:'api',desc:'GET /api/v2/health',fn:function(){return api('/api/v2/health')}},
  {id:'node',name:'Node CRUD',badge:'graph',desc:'Create node + read property',fn:function(){
    var q=hex('test-node');
    return api('/api/v2/graph/node/'+q+'/property/name',{method:'PUT',body:JSON.stringify({value:'Hello'}),headers:{'Content-Type':'application/json'}})
      .then(function(){return api('/api/v2/graph/node/'+q+'/property/name')});
  }},
  {id:'edge',name:'Edge Create & Read',badge:'graph',desc:'Create KNOWS edge + verify',fn:function(){
    var a=hex('node-A'), b=hex('node-B');
    return api('/api/v2/graph/node/'+a+'/edges',{method:'POST',body:JSON.stringify({edge_type:'KNOWS',target:b,direction:'out'}),headers:{'Content-Type':'application/json'}})
      .then(function(){return api('/api/v2/graph/node/'+a+'/edges')});
  }},
  {id:'cypher-read',name:'Cypher MATCH...RETURN',badge:'api',desc:'Read-only Cypher query',fn:function(){
    return api('/api/v2/query/cypher',{method:'POST',body:JSON.stringify({query:'MATCH (n) RETURN n LIMIT 5'}),headers:{'Content-Type':'application/json'}});
  }},
  {id:'cypher-create',name:'Cypher CREATE',badge:'api',desc:'CREATE node with properties',fn:function(){
    return api('/api/v2/query/cypher',{method:'POST',body:JSON.stringify({query:'CREATE (p:Person {name: "Alice", age: 30})'}),headers:{'Content-Type':'application/json'}});
  }},
  {id:'sq',name:'Standing Query Register+Trigger',badge:'sq',desc:'Register SQ -> Set property -> Check match count',fn:function(){
    return api('/api/v2/standing-query',{method:'POST',body:JSON.stringify({name:'sq-test',pattern:{type:'PropertyFilter',key:'speed',condition:{type:'GreaterThan',value:50}}}),headers:{'Content-Type':'application/json'}})
      .then(function(){
        return api('/api/v2/graph/node/'+hex('sq-node')+'/property/speed',{method:'PUT',body:JSON.stringify({value:80}),headers:{'Content-Type':'application/json'}});
      })
      .then(function(){
        return new Promise(function(resolve){setTimeout(resolve,300)});
      })
      .then(function(){
        return api('/api/v2/standing-query');
      })
      .then(function(list){
        return {name:list.standing_queries[0].name,match_count:list.standing_queries[0].match_count};
      });
  }},
  {id:'ingest',name:'File Ingest',badge:'graph',desc:'JSONL file bulk import',fn:function(){
    return api('/api/v2/ingest/file',{method:'POST',body:JSON.stringify({path:'demo_events.jsonl',id_field:'id'}),headers:{'Content-Type':'application/json'}});
  }},
  {id:'cypher-adv',name:'Cypher Advanced (WHERE/ORDER/LIMIT)',badge:'api',desc:'Complex query with filter+sort+limit',fn:function(){
    return api('/api/v2/query/cypher',{method:'POST',body:JSON.stringify({query:'MATCH (n) WHERE n.speed > 5 RETURN n.name, n.speed ORDER BY n.speed DESC LIMIT 3'}),headers:{'Content-Type':'application/json'}});
  }},
  {id:'e2e',name:'E2E: Ingest->SQ->Match',badge:'e2e',desc:'Full pipeline: register SQ + ingest data + check matches',fn:function(){
    return api('/api/v2/standing-query',{method:'POST',body:JSON.stringify({name:'full-flow',pattern:{type:'PropertyFilter',key:'speed',condition:{type:'GreaterThan',value:10}}}),headers:{'Content-Type':'application/json'}})
      .then(function(){
        return api('/api/v2/ingest/file',{method:'POST',body:JSON.stringify({path:'demo_events.jsonl',id_field:'id'}),headers:{'Content-Type':'application/json'}});
      })
      .then(function(){
        return new Promise(function(resolve){setTimeout(resolve,1000)});
      })
      .then(function(){
        return api('/api/v2/health');
      })
      .then(function(h){
        return api('/api/v2/standing-query').then(function(sq){
          return {nodes:h.active_nodes,matches:sq.standing_queries[0]?sq.standing_queries[0].match_count:0};
        });
      });
  }},
  {id:'dashboard',name:'Dashboard Page',badge:'api',desc:'Verify embedded dashboard loads',fn:function(){
    return fetch('/').then(function(r){return r.text()}).then(function(t){
      return {size:t.length,hasD3:t.indexOf('d3.v7')>-1,hasGraph:t.indexOf('graph-canvas')>-1};
    });
  }}
];

// Build test grid
var grid=document.getElementById('testGrid');
testCases.forEach(function(tc){
  var card=document.createElement('div');
  card.className='test';
  card.innerHTML='<h3><span class="badge '+tc.badge+'">'+tc.badge.toUpperCase()+'</span> '+tc.name+'</h3>'+
    '<div class="desc">'+tc.desc+'</div>'+
    '<button id="btn-'+tc.id+'" onclick="runOne(\''+tc.id+'\')">Run Test</button>'+
    '<pre class="result pending" id="result-'+tc.id+'">Pending...</pre>';
  grid.appendChild(card);
  total++;
});
updateCounts();

function runOne(id){
  var tc=testCases.find(function(t){return t.id===id});
  if(!tc) return;
  var el=document.getElementById('result-'+id);
  var btn=document.getElementById('btn-'+id);
  el.className='result loading';
  el.textContent='Running...';
  btn.disabled=true;
  run++;
  updateCounts();
  tc.fn().then(function(r){
    el.className='result pass';
    el.textContent='PASS\n'+JSON.stringify(r,null,2);
    pass++; run--;
  }).catch(function(e){
    el.className='result fail';
    el.textContent='FAIL\n'+e.message;
    fail++; run--;
  }).finally(function(){
    btn.disabled=false;
    updateCounts();
  });
}

function runAllTests(){
  testCases.forEach(function(tc,i){
    setTimeout(function(){ runOne(tc.id); }, i*300);
  });
}
</script>
</body>
</html>
