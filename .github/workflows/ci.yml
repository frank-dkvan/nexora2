name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # RocksDB's crc32c.cc uses PCLMUL/SSE4.2 intrinsics. On the GCC 13 runners the
  # cc crate does not pass -mpclmul (it isn't derived from rustc target-features),
  # so crc32c.cc fails with "'__builtin_ia32_pclmulqdq128' needs isa option
  # -mpclmul -msse2". Pass the ISA flags to the C/C++ build directly. Harmless on
  # x86_64; ignored where the cc crate doesn't apply them. See facebook/rocksdb#13006.
  CFLAGS: "-mpclmul -msse4.2"
  CXXFLAGS: "-mpclmul -msse4.2"

jobs:
  # Job 1: 格式化检查 (最快,优先失败)
  # 注意: 只检查工作区自己的代码, vendor/risingwave 有自己的格式规范, 不在此检查.
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 使用项目固定的 nightly (rust-toolchain.toml), 它包含 rustfmt 组件.
      # 不使用 dtolnay/rust-toolchain@stable, 否则会覆盖项目工具链.
      # rustup show 读取 rust-toolchain.toml 并触发该 nightly 的自动安装.
      - name: Install pinned toolchain
        run: rustup show
      # 用 cargo metadata --no-deps 取工作区成员(不含 vendor/risingwave),
      # 逐包 -p 检查. 不能用 `cargo fmt --all`: 它会连同 path 依赖一起格式化,
      # 把 vendor/risingwave 的上游代码卷入我们的格式规范, 产生无关 diff.
      - name: Check formatting (workspace members only, excluding vendor)
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(' '.join('-p '+p['name'] for p in json.load(sys.stdin)['packages']))")
          echo "Formatting check for: $pkgs"
          cargo fmt $pkgs --check

  # Job 2: Clippy 检查
  clippy:
    name: Clippy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protobuf, ssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config unzip
      - name: Install flatc 25.12.19
        uses: ./.github/actions/install-flatc
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run clippy (nexora-eventlog olap)
        run: cargo clippy -p nexora-eventlog --features olap --all-targets -- -D warnings
      - name: Run clippy (nexora-app event-first)
        run: cargo clippy -p nexora-app --features event-first --all-targets -- -D warnings

  # Job 3: 单元测试 (lib tests)
  test-lib:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protobuf, ssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config unzip
      - name: Install flatc 25.12.19
        uses: ./.github/actions/install-flatc
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --workspace --lib --no-fail-fast

  # Job 4: 集成测试 (可选,较慢)
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protobuf, ssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config unzip
      - name: Install flatc 25.12.19
        uses: ./.github/actions/install-flatc
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run integration tests
        run: cargo test --workspace --test '*' --no-fail-fast
        continue-on-error: true  # 集成测试失败不阻塞 PR (可选)

  # Job 4b: event-first / OLAP 特性测试 (Iceberg + DataFusion 事件优先栈)
  # 默认构建不含 olap/event-first,这些代码路径否则完全无 CI 覆盖。
  test-event-first:
    name: Event-First / OLAP Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protobuf, ssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config unzip
      - name: Install flatc 25.12.19
        uses: ./.github/actions/install-flatc
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # nexora-eventlog 的 lib + 集成测试 (需 olap:Iceberg/DataFusion/sqlx)
      - name: Test nexora-eventlog (olap)
        run: cargo test -p nexora-eventlog --features olap --no-fail-fast
      # 确认 app 侧 event-first 接线在启用特性时仍编译并通过
      - name: Test nexora-app (event-first)
        run: cargo test -p nexora-app --features event-first --no-fail-fast

  # Job 5: 安全审计
  # 注: 我们忽略了一些间接依赖的漏洞(主要来自RisingWave),这些在下面的ignore-list中配置
  # 这些漏洞已在 Issue #4 中跟踪,当上游更新时我们会修复
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 忽略间接依赖的漏洞 (wasmtime, quick-xml, rustls-webpki等来自RisingWave)
          ignore: >
            RUSTSEC-2025-0046
            RUSTSEC-2025-0118
            RUSTSEC-2026-0020
            RUSTSEC-2026-0021
            RUSTSEC-2026-0085
            RUSTSEC-2026-0086
            RUSTSEC-2026-0087
            RUSTSEC-2026-0088
            RUSTSEC-2026-0089
            RUSTSEC-2026-0091
            RUSTSEC-2026-0092
            RUSTSEC-2026-0093
            RUSTSEC-2026-0094
            RUSTSEC-2026-0095
            RUSTSEC-2026-0096
            RUSTSEC-2026-0222
            RUSTSEC-2026-0195
            RUSTSEC-2026-0194
            RUSTSEC-2026-0104
            RUSTSEC-2026-0098
            RUSTSEC-2026-0099
            RUSTSEC-2026-0049
            RUSTSEC-2026-0041
            RUSTSEC-2023-0071
            RUSTSEC-2025-0141
            RUSTSEC-2025-0057
            RUSTSEC-2024-0384
            RUSTSEC-2024-0436
            RUSTSEC-2024-0370
            RUSTSEC-2025-0134

  # Job 6: 编译检查 (release 模式)
  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protobuf, ssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config unzip
      - name: Install flatc 25.12.19
        uses: ./.github/actions/install-flatc
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace

  # 汇总 (所有必需 job 通过才算成功)
  # 注: audit 不阻塞 (安全告警单独跟踪, 见 Issue #2)
  ci-success:
    name: CI Success
    needs: [fmt, clippy, test-lib, test-event-first, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark CI as successful
        run: echo "✅ All required CI checks passed!"
