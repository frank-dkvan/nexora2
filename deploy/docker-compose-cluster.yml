# Nexora-RS 3-Node Cluster Deployment
# Usage: docker compose -f deploy/docker-compose-cluster.yml up

services:
  nexora-node-1:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - node1-data:/data
    command:
      - --cluster
      - --node-id=node-1
      - --cluster-listen-addr=0.0.0.0:7000
      - --cluster-heartbeat-addr=0.0.0.0:7001
      - --peer=node-2:nexora-node-2:7000:nexora-node-2:7001
      - --peer=node-3:nexora-node-3:7000:nexora-node-3:7001
      - --rocksdb-path=/data
      - --wal-dir=/data/wal
      - --num-shards=256
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  nexora-node-2:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - node2-data:/data
    command:
      - --cluster
      - --node-id=node-2
      - --cluster-listen-addr=0.0.0.0:7000
      - --cluster-heartbeat-addr=0.0.0.0:7001
      - --peer=node-1:nexora-node-1:7000:nexora-node-1:7001
      - --peer=node-3:nexora-node-3:7000:nexora-node-3:7001
      - --rocksdb-path=/data
      - --wal-dir=/data/wal
      - --num-shards=256
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      - nexora-node-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  nexora-node-3:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    volumes:
      - node3-data:/data
    command:
      - --cluster
      - --node-id=node-3
      - --cluster-listen-addr=0.0.0.0:7000
      - --cluster-heartbeat-addr=0.0.0.0:7001
      - --peer=node-1:nexora-node-1:7000:nexora-node-1:7001
      - --peer=node-2:nexora-node-2:7000:nexora-node-2:7001
      - --rocksdb-path=/data
      - --wal-dir=/data/wal
      - --num-shards=256
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      - nexora-node-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  node1-data:
  node2-data:
  node3-data:
