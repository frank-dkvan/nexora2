apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexora
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora
    app.kubernetes.io/component: graph-engine
    app.kubernetes.io/mode: single-durable
spec:
  serviceName: nexora
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora
      app.kubernetes.io/component: graph-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora
        app.kubernetes.io/component: graph-engine
        app.kubernetes.io/mode: single-durable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: nexora
          image: nexora:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexora-config
            - secretRef:
                name: nexora-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--rocksdb-path"
            - "/data/nexora-data"
            - "--wal-dir"
            - "/data/nexora-data/wal"
            - "--num-shards"
            - "256"
            - "--max-nodes-per-shard"
            - "10000"
            - "--udf-dir"
            - "/data/udf"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              storage: "10Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/v2/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v2/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v2/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -TERM 1"]
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nexora
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard
