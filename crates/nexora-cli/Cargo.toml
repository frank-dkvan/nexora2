[package]
name = "nexora-cli"
version.workspace = true
edition = "2021"
description = "Thin CLI client for nexora (agent-friendly, JSON-first)"

[[bin]]
name = "nex"
path = "src/main.rs"

[dependencies]
nexora-client = { path = "../nexora-client" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rustyline = "14"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

