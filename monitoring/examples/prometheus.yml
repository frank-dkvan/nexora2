global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nexora-production'
    environment: 'prod'

# Load alert rules
rule_files:
  - "/etc/prometheus/rules/nexora-alerts.yml"
  - "/etc/prometheus/rules/recording-rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Nexora cluster nodes
  - job_name: 'nexora'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'nexora-node-1:8080'
          - 'nexora-node-2:8080'
          - 'nexora-node-3:8080'
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  # Optional: Dynamic service discovery for Kubernetes
  # - job_name: 'nexora-k8s'
