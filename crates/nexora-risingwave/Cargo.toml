[package]
name = "nexora-risingwave"
version.workspace = true
edition.workspace = true
description = "Event streaming engine (SQL-based stream processing) for Nexora, backed by RisingWave"

[dependencies]
# Internal dependencies
nexora-consensus = { path = "../nexora-consensus" }
nexora-rpc = { path = "../nexora-rpc" }
nexora-eventlog = { path = "../nexora-eventlog", optional = true }
nexora-core = { path = "../nexora-core", optional = true }

# Extensions for distributed library mode
extensions-meta-raft = { path = "../../extensions/meta_raft", optional = true }

# RisingWave library integration (Phase 8 - embedded library mode)
risingwave_cmd_all = { path = "../../vendor/risingwave/src/cmd_all", optional = true }
risingwave_common = { path = "../../vendor/risingwave/src/common", optional = true }
risingwave_meta_node = { path = "../../vendor/risingwave/src/meta/node", optional = true }
risingwave_frontend = { path = "../../vendor/risingwave/src/frontend", optional = true }
risingwave_compute = { path = "../../vendor/risingwave/src/compute", optional = true }
risingwave_variables = { path = "../../vendor/risingwave/src/utils/variables", optional = true }
# Install the process-global rustls crypto provider that RisingWave's
# `standalone` entry expects (normally done by the `risingwave` binary's main).
rustls = { version = "0.23", optional = true }
# For parsing SingleNodeOpts (a clap Parser) programmatically.
clap = { version = "4", features = ["derive"], optional = true }

# Core dependencies
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Process management (Phase 7.1)
which = "7"
num_cpus = "1"
anyhow = "1"
tokio-postgres = "0.7"

# HTTP client for health checks (Phase 8)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Unix signals (for graceful shutdown)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[features]
default = []
event-first = ["nexora-eventlog", "nexora-eventlog/olap", "nexora-core"]
# Phase 7: Embedded RisingWave support (external process mode)
embedded = []
# Phase 8: Library mode (recommended - RisingWave compiled into Nexora)
library = [
    "risingwave_cmd_all",
    "risingwave_common",
    "risingwave_meta_node",
    "risingwave_frontend",
    "risingwave_compute",
    "risingwave_variables",
    "rustls",
    "clap",
    "extensions-meta-raft"
]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
toml = "0.8"
num_cpus = "1"
tokio-postgres = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[[example]]
name = "distributed_risingwave_demo"
required-features = ["embedded"]

[[example]]
name = "cargo_terminal_demo"
required-features = ["embedded"]

[[example]]
name = "cargo_terminal_mock"

[[example]]
name = "library_single_node"
required-features = ["library"]
