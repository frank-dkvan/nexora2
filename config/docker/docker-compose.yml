version: '3.8'

services:
  nexora:
    image: nexora:latest
    container_name: nexora
    ports:
      - "8080:8080"
      - "9090:9090"  # Metrics
    environment:
      - NEXORA_AUTH_REQUIRED=true
      - NEXORA_AUTH_SECRET=${NEXORA_AUTH_SECRET}
      - NEXORA_ENCRYPTION_KEY=${NEXORA_ENCRYPTION_KEY}
      - NEXORA_NODE_ID=node-1
      - RUST_LOG=info
    volumes:
      - nexora-data:/var/lib/nexora/data
      - ./config/nexora.toml:/etc/nexora/nexora.toml:ro
      - ./tls:/etc/nexora/tls:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: nexora-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nexora-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  nexora-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: nexora-network
