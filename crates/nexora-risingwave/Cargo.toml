[package]
name = "nexora-risingwave"
version.workspace = true
edition.workspace = true
description = "RisingWave integration for advanced stream processing"

[dependencies]
# Internal dependencies
nexora-consensus = { path = "../nexora-consensus" }
nexora-rpc = { path = "../nexora-rpc" }

# RisingWave components (Phase 3: simplified, full integration in Phase 4)
# Note: These will be added in Phase 4 when we integrate with vendor/risingwave

# Core dependencies
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[features]
default = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
