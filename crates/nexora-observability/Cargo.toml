[package]
name = "nexora-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }

# Prometheus metrics
prometheus = { version = "0.13", features = ["process"] }

# OpenTelemetry tracing
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry_sdk = { version = "0.24", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.25"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# HTTP server for metrics/health
axum = "0.7"
tower = { workspace = true }
tower-http = { version = "0.5", features = ["trace"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[dependencies.async-trait]
version = "0.1"

[dependencies.futures]
version = "0.3"

[dependencies.chrono]
workspace = true
